name: Project_CI

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to build"
        required: true
        default: "develop/chirag"
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 0

      - name: Display Build Information
        run: |
          echo "========================================"
          echo "Project Name : SchemaCraft AI"
          echo "Workflow     : Project_CI"
          echo "Run Number   : ${{ github.run_number }}"
          echo "Run ID       : ${{ github.run_id }}"
          echo "Triggered By : ${{ github.actor }}"
          echo "Branch       : ${{ inputs.branch }}"
          echo "Commit SHA   : $(git rev-parse --short HEAD)"
          echo "========================================"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run Type Check
        run: npm run typecheck

      - name: Run Unit Tests
        run: npm test

      - name: Build Application
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
        run: npm run build

      - name: Validate Build Output
        run: |
          set -e

          if [ ! -f ".next/standalone/server.js" ]; then
            echo "Next.js standalone server was not generated."
            exit 1
          fi

          if [ ! -d ".next/static" ]; then
            echo "Next.js static directory was not generated."
            exit 1
          fi

          echo "========================================"
          echo "Build completed successfully"
          echo "Standalone server: Found"
          echo "Static assets    : Found"
          echo "========================================"

      - name: Create Deployment Package
        run: |
          set -e

          ARTIFACT_FILE="schemacraft-build-${{ github.run_number }}.zip"

          zip -r "$ARTIFACT_FILE" . \
            -x ".git/*" \
            -x ".github/*" \
            -x "node_modules/*" \
            -x ".next/cache/*" \
            -x "$ARTIFACT_FILE"

          echo "Created deployment package:"
          ls -lh "$ARTIFACT_FILE"

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: schemacraft-build-${{ github.run_number }}
          path: schemacraft-build-${{ github.run_number }}.zip
          retention-days: 30
          if-no-files-found: error

      - name: Build Summary
        run: |
          echo "========================================"
          echo "CI Pipeline Completed Successfully"
          echo "Build Number : ${{ github.run_number }}"
          echo "Artifact     : schemacraft-build-${{ github.run_number }}"
          echo "Branch       : ${{ inputs.branch }}"
          echo "========================================"