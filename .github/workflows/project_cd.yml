name: Project_CD

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: "Enter CI Build Number"
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  deploy:
    name: Deploy Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Selected Build Artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e

          BUILD_NUMBER="${{ inputs.build_number }}"
          ARTIFACT_NAME="schemacraft-build-${BUILD_NUMBER}"

          echo "=================================="
          echo "Project CD Started"
          echo "Build    : ${BUILD_NUMBER}"
          echo "Artifact : ${ARTIFACT_NAME}"
          echo "=================================="

          ARTIFACT_ID=$(gh api \
            "repos/${{ github.repository }}/actions/artifacts?name=${ARTIFACT_NAME}" \
            --jq '.artifacts | sort_by(.created_at) | reverse | .[0].id // empty')

          if [ -z "$ARTIFACT_ID" ]; then
            echo "Artifact ${ARTIFACT_NAME} not found."
            exit 1
          fi

          echo "Artifact ID: ${ARTIFACT_ID}"

          curl --fail --location \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/${ARTIFACT_ID}/zip" \
            --output schemacraft-build.zip

          echo "Downloaded artifact:"
          ls -lh schemacraft-build.zip

          echo "Artifact contents:"
          unzip -l schemacraft-build.zip

      - name: Copy Artifact to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          source: "schemacraft-build.zip"
          target: "/tmp"

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          script: |
            set -e

            APP_DIR="/opt/schemacraft-ai"

            echo "=================================="
            echo "Preparing Deployment Directory"
            echo "=================================="

            sudo mkdir -p "$APP_DIR"
            sudo chown -R "$USER:$USER" "$APP_DIR"

            cd "$APP_DIR"

            if [ ! -f ".env" ]; then
              echo ".env file not found in ${APP_DIR}"
              exit 1
            fi

            # Remove the previous deployment while preserving environment files.
            find . \
              -mindepth 1 \
              -maxdepth 1 \
              ! -name ".env" \
              ! -name ".env.local" \
              ! -name ".env.production" \
              -exec rm -rf {} +

            echo "=================================="
            echo "Extracting GitHub Artifact"
            echo "=================================="

            unzip -oq /tmp/schemacraft-build.zip

            DEPLOYMENT_ZIP=$(find . \
              -maxdepth 1 \
              -type f \
              -name "schemacraft-build-*.zip" \
              | head -1)

            if [ -z "$DEPLOYMENT_ZIP" ]; then
              echo "Deployment package not found inside GitHub artifact."
              exit 1
            fi

            echo "Deployment package: ${DEPLOYMENT_ZIP}"

            unzip -oq "$DEPLOYMENT_ZIP"
            rm -f "$DEPLOYMENT_ZIP"

            echo "=================================="
            echo "Validating Deployment Package"
            echo "=================================="

            if [ ! -f "package.json" ]; then
              echo "package.json not found after extraction."
              exit 1
            fi

            if [ ! -f ".next/standalone/server.js" ]; then
              echo "Next.js standalone server not found."
              exit 1
            fi

            if [ ! -d ".next/static" ]; then
              echo "Next.js static directory not found."
              exit 1
            fi

            echo "=================================="
            echo "Copying Static and Public Assets"
            echo "=================================="

            mkdir -p .next/standalone/.next

            rm -rf .next/standalone/.next/static
            cp -r .next/static .next/standalone/.next/static

            if [ -d "public" ]; then
              rm -rf .next/standalone/public
              cp -r public .next/standalone/public
            fi

            echo "=================================="
            echo "Loading Environment Variables"
            echo "=================================="

            set -a
            . ./.env
            set +a

            export NODE_ENV="production"
            export HOSTNAME="0.0.0.0"
            export PORT="3000"

            echo "=================================="
            echo "Starting Application"
            echo "=================================="

            pm2 delete schemacraft-ai || true

            pm2 start .next/standalone/server.js \
              --name schemacraft-ai \
              --cwd "$APP_DIR" \
              --interpreter node

            pm2 save

            echo "=================================="
            echo "Validating Deployment"
            echo "=================================="

            sleep 5

            HTTP_STATUS=$(curl \
              --silent \
              --output /dev/null \
              --write-out "%{http_code}" \
              http://127.0.0.1:3000)

            echo "Application HTTP Status: ${HTTP_STATUS}"

            if [ "$HTTP_STATUS" != "200" ] && \
               [ "$HTTP_STATUS" != "307" ] && \
               [ "$HTTP_STATUS" != "308" ]; then
              echo "Application health check failed."
              pm2 logs schemacraft-ai --lines 50 --nostream
              exit 1
            fi

            STATIC_FILE=$(find .next/standalone/.next/static \
              -type f \
              -name "*.css" \
              | head -1)

            if [ -z "$STATIC_FILE" ]; then
              echo "No CSS file found in the standalone static directory."
              exit 1
            fi

            STATIC_PATH="${STATIC_FILE#.next/standalone/.next/static}"
            STATIC_STATUS=$(curl \
              --silent \
              --output /dev/null \
              --write-out "%{http_code}" \
              "http://127.0.0.1:3000/_next/static${STATIC_PATH}")

            echo "Static Asset HTTP Status: ${STATIC_STATUS}"

            if [ "$STATIC_STATUS" != "200" ]; then
              echo "Static asset health check failed."
              pm2 logs schemacraft-ai --lines 50 --nostream
              exit 1
            fi

            pm2 status

            rm -f /tmp/schemacraft-build.zip

            echo "=================================="
            echo "Deployment Completed Successfully"
            echo "=================================="

      - name: Deployment Summary
        run: |
          echo "=================================="
          echo "SchemaCraft AI Deployment Success"
          echo "Build : ${{ inputs.build_number }}"
          echo "URL   : http://${{ secrets.EC2_HOST }}"
          echo "=================================="